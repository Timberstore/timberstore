name: Refresh public Instagram gallery data
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: instagram-data-refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/refresh-instagram.py
      - name: Publish changed data only
        run: |
          if ! git diff --quiet -- data/instagram.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/instagram.json
            git commit -m 'Refresh verified Instagram gallery data'
            git push origin HEAD:main
          fi
