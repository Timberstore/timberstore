name: Validate Instagram gallery snapshot
on:
  # A weekly review reminder, never an HTML scrape. Content age is not source health.
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/instagram.json'
      - 'scripts/refresh-instagram.py'
      - 'tests/test_refresh_instagram.py'
      - '.github/workflows/refresh-instagram.yml'
  push:
    branches: [main]
    paths:
      - 'data/instagram.json'
      - 'scripts/refresh-instagram.py'
      - 'tests/test_refresh_instagram.py'
      - '.github/workflows/refresh-instagram.yml'
permissions:
  contents: read
concurrency:
  group: instagram-data-validation-${{ github.ref }}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test feed refresh safety
        run: python -m unittest discover -s tests -p 'test_refresh_instagram.py'
      - name: Validate saved gallery and report review status
        run: python scripts/refresh-instagram.py --check
