name: Refresh public Instagram gallery data
on:
  schedule:
    - cron: '0 3 * * *'
      timezone: Europe/Bratislava
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/instagram.json'
      - 'scripts/*instagram*.py'
      - 'tests/test_*instagram*.py'
      - '.github/workflows/refresh-instagram.yml'
permissions:
  contents: read
concurrency:
  group: instagram-data-refresh-${{ github.ref }}
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test feed refresh and health safety
        run: python -m unittest discover -s tests -p 'test_*instagram*.py'
      - name: Validate last good gallery
        run: python scripts/refresh-instagram.py --check
  refresh:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refresh Instagram source
        id: source
        continue-on-error: true
        run: python scripts/refresh-instagram.py
      # These stable markers persist the real source outcome even if the job
      # tolerates a single outage. The health script reads them through Jobs API.
      - name: Instagram source verified
        if: steps.source.outcome == 'success'
        run: echo 'Source acquisition and feed validation succeeded.'
      - name: Instagram source unavailable
        if: steps.source.outcome == 'failure' && steps.source.outputs.source_unavailable == 'true'
        run: echo 'Upstream acquisition unavailable; last good gallery retained.'
      - name: Assess repeated acquisition failures
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          SOURCE_UNAVAILABLE: ${{ steps.source.outputs.source_unavailable || 'false' }}
        run: python scripts/instagram-refresh-health.py --outcome "$SOURCE_OUTCOME" --source-unavailable "$SOURCE_UNAVAILABLE"
      - name: Fail unsuccessful branch diagnostics
        if: github.ref != 'refs/heads/main' && steps.source.outcome != 'success'
        run: exit 1
      - name: Publish changed data only
        if: github.ref == 'refs/heads/main' && steps.source.outcome == 'success'
        run: |
          if ! git diff --quiet -- data/instagram.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/instagram.json
            git commit -m 'Refresh verified Instagram gallery data'
            git push origin HEAD:main
          fi
