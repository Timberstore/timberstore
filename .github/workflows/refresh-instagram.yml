name: Test Instagram gallery
on:
  pull_request:
    paths:
      - '.github/workflows/refresh-instagram.yml'
      - 'scripts/refresh-instagram.py'
      - 'tests/test_refresh_instagram.py'
      - 'tests/test_instagram_browser.py'
      - 'src/modules/instagram/**'
      - 'src/core/contacts.js'
      - 'src/styles/overrides/instagram.css'
permissions:
  contents: read
concurrency:
  group: instagram-data-refresh-${{ github.ref }}
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install Pillow==12.3.0
      - run: python -m unittest discover -s tests -p 'test_refresh_instagram.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm run lint && npm run build
      - run: |
          pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          python -m unittest discover -s tests -p 'test_instagram_browser.py'
