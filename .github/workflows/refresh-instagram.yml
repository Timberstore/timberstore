name: Refresh public Instagram gallery data
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: instagram-data-refresh
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test feed refresh safety
        run: python -m unittest discover -s tests -p 'test_refresh_instagram.py'
      - run: python scripts/refresh-instagram.py
      - name: Publish changed data only
        if: github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- data/instagram.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/instagram.json
            git commit -m 'Refresh verified Instagram gallery data'
            git push origin HEAD:main
          fi
